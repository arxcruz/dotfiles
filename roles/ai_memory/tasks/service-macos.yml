---
- name: Ensure ~/Library/LaunchAgents exists
  file:
    path: "{{ ansible_facts.user_dir }}/Library/LaunchAgents"
    state: directory
    mode: '0755'

- name: Ensure ai-memory log directory exists
  file:
    path: "{{ ansible_facts.user_dir }}/Library/Logs/ai-memory"
    state: directory
    mode: '0755'

- name: Deploy ai-memory launchd agent
  template:
    src: com.github.akitaonrails.ai-memory.plist.j2
    dest: "{{ ansible_facts.user_dir }}/Library/LaunchAgents/com.github.akitaonrails.ai-memory.plist"
    mode: '0644'
  register: ai_memory_launchd

- name: Load ai-memory launchd agent
  shell: >
    launchctl bootout gui/{{ ansible_facts.user_uid }} {{ ansible_facts.user_dir }}/Library/LaunchAgents/com.github.akitaonrails.ai-memory.plist 2>/dev/null;
    launchctl bootstrap gui/{{ ansible_facts.user_uid }} {{ ansible_facts.user_dir }}/Library/LaunchAgents/com.github.akitaonrails.ai-memory.plist
  when: ai_memory_launchd.changed
