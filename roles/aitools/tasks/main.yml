---
# npm's default global prefix (/usr/lib/node_modules on this Nodesource
# install) requires root. Point it at a user-writable directory instead of
# relying on the desktop-only system/npm-global.yml task, since this role
# also runs on servers where that task never gets included.
- name: Ensure ~/.npm-global directory exists
  file:
    path: "{{ ansible_facts.user_dir }}/.npm-global"
    state: directory
    mode: '0755'

- name: Set npm global prefix to user-local directory
  command: "npm config set prefix {{ ansible_facts.user_dir }}/.npm-global"
  changed_when: false

- name: Install/update Claude Code CLI
  npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: latest

- name: Ensure Claude Code profile directories exist
  file:
    path: "{{ ansible_facts.user_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - .claude-work
    - .claude-personal

- name: Deploy Claude Code statusline.sh to each profile
  copy:
    src: claude-statusline.sh
    dest: "{{ ansible_facts.user_dir }}/{{ item }}/statusline.sh"
    mode: '0755'
  loop:
    - .claude-work
    - .claude-personal

- name: Check if Claude Code settings.json exists in each profile
  stat:
    path: "{{ ansible_facts.user_dir }}/{{ item }}/settings.json"
  register: claude_settings_stats
  loop:
    - .claude-work
    - .claude-personal

- name: Read Claude Code settings.json from each profile if present
  slurp:
    path: "{{ ansible_facts.user_dir }}/{{ item.item }}/settings.json"
  register: claude_settings_files
  loop: "{{ claude_settings_stats.results }}"
  when: item.stat.exists

- name: Ensure statusLine is configured in each Claude Code settings.json
  vars:
    _stat: "{{ claude_settings_stats.results | selectattr('item', 'equalto', item) | first }}"
    _slurp: "{{ claude_settings_files.results | selectattr('item.item', 'equalto', item) | first | default({}) }}"
    _raw: "{{ _slurp.content | default('') | b64decode | trim }}"
    _existing: "{{ (_raw != '') | ternary(_raw | from_json, {}) }}"
  copy:
    content: >-
      {{
        _existing
        | combine({
            'statusLine': {
              'type': 'command',
              'command': '~/{{ item }}/statusline.sh'
            }
          }, recursive=True)
        | to_nice_json(indent=2)
      }}
    dest: "{{ ansible_facts.user_dir }}/{{ item }}/settings.json"
    mode: '0644'
  loop:
    - .claude-work
    - .claude-personal

- name: Install/update antigravity-cli
  shell: curl -fsSL https://antigravity.google/cli/install.sh | bash
  changed_when: false

- name: Ensure antigravity-cli directory exists
  file:
    path: "{{ ansible_facts.user_dir }}/.gemini/antigravity-cli"
    state: directory
    mode: '0755'

- name: Deploy antigravity-cli statusline.sh
  copy:
    src: antigravity-statusline.sh
    dest: "{{ ansible_facts.user_dir }}/.gemini/antigravity-cli/statusline.sh"
    mode: '0755'

- name: Check if antigravity-cli settings.json exists
  stat:
    path: "{{ ansible_facts.user_dir }}/.gemini/antigravity-cli/settings.json"
  register: antigravity_settings_stat

- name: Read antigravity-cli settings.json if present
  slurp:
    path: "{{ ansible_facts.user_dir }}/.gemini/antigravity-cli/settings.json"
  register: antigravity_settings_file
  when: antigravity_settings_stat.stat.exists

- name: Ensure statusLine is configured in antigravity-cli settings.json
  copy:
    content: >-
      {{
        ((antigravity_settings_file.content | default('') | b64decode | from_json)
         if (antigravity_settings_stat.stat.exists and (antigravity_settings_file.content | default('') | b64decode | trim != ''))
         else {})
        | combine({
            'statusLine': {
              'type': 'command',
              'command': '~/.gemini/antigravity-cli/statusline.sh'
            }
          }, recursive=True)
        | to_nice_json(indent=2)
      }}
    dest: "{{ ansible_facts.user_dir }}/.gemini/antigravity-cli/settings.json"
    mode: '0644'
